<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KR7</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body style="background:black;color:white;text-align:center">

<h1>KR7 PERFORMANCE</h1>

<div id="dados"></div>

<br>

<input id="valor" placeholder="Digite valor">
<button onclick="salvar()">Atualizar</button>

<script>

const supabase = window.supabase.createClient(
  "https://fjysqoqglqlpfxvxvvzt.supabase.co",
  "sb_publishable_5OYsGs28d5eh9pBbOTBa6Q_YepVgSYV"
);

// TESTE DE LEITURA
async function carregar(){
  const { data, error } = await supabase
    .from("ranking")
    .select("*");

  if(error){
    console.log("ERRO:", error);
  }

  document.getElementById("dados").innerHTML =
    JSON.stringify(data);
}

// TESTE DE ESCRITA
async function salvar(){

  let v = Number(document.getElementById("valor").value);

  const { error } = await supabase
    .from("ranking")
    .update({ hype: v })
    .eq("id", 1);

  if(error){
    console.log("ERRO AO SALVAR:", error);
  } else {
    alert("SALVOU!");
  }

  carregar();
}

carregar();

</script>

</body>
</html>
