<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>KR7 Ranking</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin:0;
  font-family:-apple-system, sans-serif;
  background:#0d0d0d;
  color:#fff;
  text-align:center;
}

h1 { margin-top:20px; }

.ranking-box {
  display:flex;
  justify-content:space-around;
  margin-top:30px;
}

.ranking {
  width:40%;
  background:#1a1a1a;
  border-radius:20px;
  padding:20px;
}

.rank-item {
  font-size:20px;
  margin:8px 0;
}

.control {
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  padding:10px;
}

input {
  width:80px;
  margin:3px;
}
</style>
</head>

<body>

<h1>KR7 RANKING</h1>

<div class="ranking-box">

  <div class="ranking">
    <h3>🏆 HYPE</h3>
    <div id="rankingHype"></div>
  </div>

  <div class="ranking">
    <h3>🏆 OUTROS</h3>
    <div id="rankingGeral"></div>
  </div>

</div>

<div class="control">
  DAN <input id="d_h"> <input id="d_g">
  EMA <input id="e_h"> <input id="e_g">
  FLA <input id="f_h"> <input id="f_g">
  LUC <input id="l_h"> <input id="l_g">
  OLI <input id="o_h"> <input id="o_g">
  <button onclick="atualizar()">Atualizar</button>
</div>

<script>

// 🔥 CONFIGURAÇÃO (JÁ CORRIGIDA)
const supabaseUrl = "https://fjysqoqglqlpfxvxvvzt.supabase.co";
const supabaseKey = "sb_publishable_5OYsGs28d5eh9pBbOTBa6Q_YepVgSYV";

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

// FORMATAR
function formatar(v){
  return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

// CONVERTER BR
function parseBR(valor){
  if(!valor) return 0;
  return Number(valor.replace(/\./g,"").replace(",", ".")) || 0;
}

// SALVAR (AGORA FUNCIONANDO)
async function salvar(corretores){

  for(let i=0;i<corretores.length;i++){

    let c = corretores[i];

    const { error } = await supabase
      .from("ranking")
      .update({
        hype: c.hype,
        geral: c.geral
      })
      .eq("id", i+1);

    if(error){
      console.log("ERRO:", error);
    } else {
      console.log("SALVOU:", c.nome);
    }
  }
}

// CARREGAR
async function carregar(){

  const { data, error } = await supabase
    .from("ranking")
    .select("*");

  if(error){
    console.log("ERRO AO CARREGAR:", error);
    return;
  }

  if(data){
    render(data);
  }
}

// RENDER
function render(lista){

  let pos=["🥇","🥈","🥉","4º","5º"];

  let hypeRank=[...lista].sort((a,b)=>b.hype-a.hype);
  let geralRank=[...lista].sort((a,b)=>b.geral-a.geral);

  document.getElementById("rankingHype").innerHTML =
    hypeRank.map((c,i)=><div class="rank-item">${pos[i]} ${c.nome} - ${formatar(c.hype)}</div>).join("");

  document.getElementById("rankingGeral").innerHTML =
    geralRank.map((c,i)=><div class="rank-item">${pos[i]} ${c.nome} - ${formatar(c.geral)}</div>).join("");
}

// BOTÃO
async function atualizar(){

  let corretores = [
    { nome:"DANIELLA", hype:parseBR(d_h.value), geral:parseBR(d_g.value) },
    { nome:"EMANUEL", hype:parseBR(e_h.value), geral:parseBR(e_g.value) },
    { nome:"FLÁVIO", hype:parseBR(f_h.value), geral:parseBR(f_g.value) },
    { nome:"LUCIANO", hype:parseBR(l_h.value), geral:parseBR(l_g.value) },
    { nome:"OLIVEIRA", hype:parseBR(o_h.value), geral:parseBR(o_g.value) }
  ];

  await salvar(corretores);
  carregar();
}

// ATUALIZA AUTOMATICO
setInterval(carregar, 3000);

// PRIMEIRA CARGA
carregar();

</script>

</body>
</html>
