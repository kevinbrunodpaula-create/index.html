<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KR7</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body style="background:black;color:white;text-align:center">

<h1>KR7 PERFORMANCE</h1>

<input id="valor" placeholder="Digite valor">
<button id="btn">Atualizar</button>

<div id="status"></div>

<script>

// 🔥 CRIA APENAS UMA VEZ
const client = window.supabase.createClient(
  "https://fjysqoqglqlpfxvxvvzt.supabase.co",
  "sb_publishable_5OYsGs28d5eh9pBbOTBa6Q_YepVgSYV"
);

// 🔥 BOTÃO FUNCIONANDO
document.getElementById("btn").addEventListener("click", async function(){

  let v = Number(document.getElementById("valor").value);

  const { error } = await client
    .from("ranking")
    .update({ hype: v })
    .eq("id", 1);

  if(error){
    document.getElementById("status").innerText = "ERRO: " + error.message;
    console.log(error);
  }else{
    document.getElementById("status").innerText = "SALVO COM SUCESSO";
  }

});

</script>

</body>
</html>
