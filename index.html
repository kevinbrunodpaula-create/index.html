<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>KR7 Performance</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#0b0b0b;
  color:#fff;
  text-align:center;
}

h1{
  margin-top:20px;
  font-size:40px;
}

.meta{
  margin-top:10px;
  color:#aaa;
}

.container{
  display:flex;
  justify-content:space-around;
  margin-top:40px;
}

.box{
  width:40%;
  background:#1a1a1a;
  padding:20px;
  border-radius:20px;
}

.rank{
  margin:10px 0;
  font-size:20px;
}

.total{
  margin-top:30px;
  font-size:22px;
}

.control{
  position:fixed;
  bottom:0;
  width:100%;
  background:#111;
  padding:10px;
}

input{
  width:90px;
}
</style>
</head>

<body>

<h1>KR7 PERFORMANCE</h1>
<div class="meta">META TOTAL: R$ 2.000.000,00</div>

<div class="container">

  <div class="box">
    <h2>🏆 HYPE (META 1MM)</h2>
    <div id="hype"></div>
  </div>

  <div class="box">
    <h2>🏆 OUTROS (META 1MM)</h2>
    <div id="geral"></div>
  </div>

</div>

<div class="total" id="total">TOTAL: R$ 0,00</div>

<div class="control">
  DAN <input id="d_h"> <input id="d_g">
  EMA <input id="e_h"> <input id="e_g">
  FLA <input id="f_h"> <input id="f_g">
  LUC <input id="l_h"> <input id="l_g">
  OLI <input id="o_h"> <input id="o_g">
  <button onclick="atualizar()">Atualizar</button>
</div>

<script>

const supabaseUrl = "https://fjysqoqglqlpfxvxvvzt.supabase.co";
const supabaseKey = "sb_publishable_5OYsGs28d5eh9pBbOTBa6Q_YepVgSYV";

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

function moeda(v){
  return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function parse(v){
  if(!v) return 0;
  return Number(v.replace(/\./g,"").replace(",","."));
}

// 🔥 CARREGAR
async function carregar(){

  const { data, error } = await supabase
    .from("ranking")
    .select("*");

  if(error){
    console.log(error);
    return;
  }

  if(data){
    render(data);
  }
}

// 🔥 RENDER
function render(lista){

  let pos=["🥇","🥈","🥉","4º","5º"];

  let hype = [...lista].sort((a,b)=>b.hype-a.hype);
  let geral = [...lista].sort((a,b)=>b.geral-a.geral);

  document.getElementById("hype").innerHTML =
    hype.map((c,i)=><div class="rank">${pos[i]} ${c.nome} - ${moeda(c.hype)}</div>).join("");

  document.getElementById("geral").innerHTML =
    geral.map((c,i)=><div class="rank">${pos[i]} ${c.nome} - ${moeda(c.geral)}</div>).join("");

  let total = lista.reduce((s,c)=>s+c.hype+c.geral,0);
  document.getElementById("total").innerHTML = "TOTAL: " + moeda(total);
}

// 🔥 SALVAR (CORRIGIDO)
async function atualizar(){

  let dados = [
    parse(d_h.value), parse(d_g.value),
    parse(e_h.value), parse(e_g.value),
    parse(f_h.value), parse(f_g.value),
    parse(l_h.value), parse(l_g.value),
    parse(o_h.value), parse(o_g.value)
  ];

  let nomes = ["DANIELLA","EMANUEL","FLÁVIO","LUCIANO","OLIVEIRA"];

  for(let i=0;i<5;i++){

    let { error } = await supabase
      .from("ranking")
      .update({
        hype: dados[i*2],
        geral: dados[i*2+1]
      })
      .eq("id", i+1);

    if(error){
      console.log("ERRO:", error);
    }
  }

  setTimeout(carregar,1000);
}

setInterval(carregar,3000);
carregar();

</script>

</body>
</html>
